<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>शिवस्वराज्य संघटना उत्सव App</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 15px; background: #f4f6f9; }
    .card { background: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    h2, h3 { margin-top: 0; color: #333; }
    input, select, button { width: 100%; padding: 10px; margin: 5px 0 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; }
    button.danger { background: #dc3545; width: auto; padding: 5px 10px; margin: 0; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #f2f2f2; }
    .hidden { display: none; }
    .totals { font-weight: bold; background: #e9ecef; }
  </style>
</head>
<body>

  <!-- Login Section -->
  <div id="loginSection" class="card">
    <h2>Login</h2>
    <input type="text" id="username" placeholder="Username (e.g. User 1)">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>

  <!-- Main App Section -->
  <div id="appSection" class="hidden">
    <div class="card">
      <h2 id="userWelcome"></h2>
      <button onclick="logout()" style="background:#6c757d;">Logout</button>
    </div>

    <!-- Event Selection/Creation -->
    <div class="card">
      <h3>1. Select Event (उत्सव)</h3>
      <select id="eventSelect" onchange="loadEventData()">
        <option value="Shiv Jayanti 2026">Shiv Jayanti 2026</option>
      </select>
      
      <div id="adminEventControls" class="hidden">
        <input type="text" id="newEventName" placeholder="New Event Name (e.g. Ganesh Utsav)">
        <button onclick="addNewEvent()" style="background:#28a745;">Add New Event</button>
      </div>
    </div>

    <!-- Add Donation Form -->
    <div class="card">
      <h3>2. Add Donation Entry</h3>
      <input type="text" id="donorName" placeholder="Donor Name">
      <input type="number" id="donorAmount" placeholder="Amount (₹)">
      <select id="donorCategory">
        <option value="P1">Category P1</option>
        <option value="P2">Category P2</option>
        <option value="P3">Category P3</option>
      </select>
      <button onclick="addDonation()">Save Entry</button>
    </div>

    <!-- Totals Summary -->
    <div class="card">
      <h3>Category Totals</h3>
      <p class="totals">P1: ₹<span id="totP1">0</span> | P2: ₹<span id="totP2">0</span> | P3: ₹<span id="totP3">0</span></p>
      <p class="totals" style="color: green;">Grand Total: ₹<span id="totGrand">0</span></p>
    </div>

    <!-- Donations List -->
    <div class="card">
      <h3>Donation History</h3>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Amount</th>
            <th>Cat</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="donationTableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    // Firebase Config (Replace with your own config if needed)
    const firebaseConfig = {
      databaseURL: "https://shivswarajya-sanghatna-app-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentUser = null;

    function login() {
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();
      if(u === 'User 1' && p === 'admin123') {
        currentUser = { name: u, role: 'admin' };
      } else if(u && p) {
        currentUser = { name: u, role: 'user' };
      } else {
        alert('Invalid Details');
        return;
      }
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('appSection').classList.remove('hidden');
      document.getElementById('userWelcome').innerText = `Welcome, ${currentUser.name} (${currentUser.role})`;
      
      if(currentUser.role === 'admin') {
        document.getElementById('adminEventControls').classList.remove('hidden');
      }
      
      loadEvents();
    }

    function logout() {
      location.reload();
    }

    function loadEvents() {
      db.ref('events').on('value', snapshot => {
        const select = document.getElementById('eventSelect');
        select.innerHTML = '';
        const data = snapshot.val();
        if(data) {
          Object.keys(data).forEach(evt => {
            let opt = document.createElement('option');
            opt.value = evt;
            opt.innerText = evt;
            select.appendChild(opt);
          });
        } else {
          db.ref('events/Shiv Jayanti 2026').set(true);
        }
        loadEventData();
      });
    }

    function addNewEvent() {
      const name = document.getElementById('newEventName').value.trim();
      if(!name) return;
      db.ref('events/' + name).set(true);
      document.getElementById('newEventName').value = '';
      alert('Event Created!');
    }

    function addDonation() {
      const eventName = document.getElementById('eventSelect').value;
      const name = document.getElementById('donorName').value.trim();
      const amount = parseFloat(document.getElementById('donorAmount').value);
      const category = document.getElementById('donorCategory').value;

      if(!name || isNaN(amount)) {
        alert('Enter valid name and amount');
        return;
      }

      db.ref(`donations/${eventName}`).push({
        name: name,
        amount: amount,
        category: category,
        addedBy: currentUser.name
      });

      document.getElementById('donorName').value = '';
      document.getElementById('donorAmount').value = '';
    }

    function loadEventData() {
      const eventName = document.getElementById('eventSelect').value;
      if(!eventName) return;

      db.ref(`donations/${eventName}`).on('value', snapshot => {
        const tbody = document.getElementById('donationTableBody');
        tbody.innerHTML = '';
        
        let p1 = 0, p2 = 0, p3 = 0;
        const data = snapshot.val();

        if(data) {
          Object.keys(data).forEach(key => {
            const item = data[key];
            if(item.category === 'P1') p1 += item.amount;
            if(item.category === 'P2') p2 += item.amount;
            if(item.category === 'P3') p3 += item.amount;

            let row = `<tr>
              <td>${item.name}</td>
              <td>₹${item.amount}</td>
              <td>${item.category}</td>
              <td>
                <button class="danger" onclick="deleteEntry('${eventName}', '${key}')">Delete</button>
              </td>
            </tr>`;
            tbody.innerHTML += row;
          });
        }

        document.getElementById('totP1').innerText = p1;
        document.getElementById('totP2').innerText = p2;
        document.getElementById('totP3').innerText = p3;
        document.getElementById('totGrand').innerText = p1 + p2 + p3;
      });
    }

    function deleteEntry(eventName, key) {
      if(confirm('Are you sure you want to delete this entry?')) {
        db.ref(`donations/${eventName}/${key}`).remove();
      }
    }
  </script>
</body>
</html>
